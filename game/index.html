<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Lanterns — Spot the Difference</title>
<style>
  html, body { margin: 0; height: 100%; background: #191430; }
  body { display: grid; place-items: center; overflow: hidden; }
  #game { display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Twin Lanterns spot the difference game: two near-identical pictures side by side. Click a difference on either picture to mark it."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
